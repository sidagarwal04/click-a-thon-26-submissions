server {
    listen 80;
    listen [::]:80;
    server_name clickathon26.nannan.in;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clickathon26.nannan.in;

    ssl_certificate /etc/letsencrypt/live/clickathon26.nannan.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clickathon26.nannan.in/privkey.pem;

    client_max_body_size 256m;

    # The LibreChat runtime uses these authenticated endpoints for bounded
    # source profiling and ingestion. Some valid ingest/validation calls last
    # longer than Nginx's default 60-second upstream read timeout.
    location /internal/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        send_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
